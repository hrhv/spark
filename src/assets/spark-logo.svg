<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" fill="#FFFFFF"/>
  
  <!-- Main calendar card with rounded corners -->
  <rect x="28" y="36" width="200" height="188" rx="20" ry="20" fill="url(#sparkGrad)" filter="url(#shadow)"/>
  
  <!-- Top colored bar (date indicator) -->
  <rect x="28" y="36" width="200" height="48" rx="20" ry="20" fill="#1E40AF"/>
  
  <!-- Grid pattern - calendar cells -->
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.8">
    <!-- Vertical lines -->
    <line x1="56" y1="100" x2="56" y2="208"/>
    <line x1="84" y1="100" x2="84" y2="208"/>
    <line x1="112" y1="100" x2="112" y2="208"/>
    <line x1="140" y1="100" x2="140" y2="208"/>
    <line x1="168" y1="100" x2="168" y2="208"/>
    <line x1="196" y1="100" x2="196" y2="208"/>
    
    <!-- Horizontal lines -->
    <line x1="28" y1="128" x2="228" y2="128"/>
    <line x1="28" y1="156" x2="228" y2="156"/>
    <line x1="28" y1="184" x2="228" y2="184"/>
  </g>
  
  <!-- Day numbers/dots in grid cells -->
  <circle cx="42" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="70" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="98" cy="114" r="3" fill="#FFFFFF"/>
  <circle cx="126" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="154" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="182" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="210" cy="114" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  
  <circle cx="42" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="70" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="98" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="126" cy="142" r="3" fill="#FFFFFF"/>
  <circle cx="154" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="182" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="210" cy="142" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  
  <circle cx="42" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="70" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="98" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="126" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="154" cy="170" r="3" fill="#FFFFFF"/>
  <circle cx="182" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="210" cy="170" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  
  <circle cx="42" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="70" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="98" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="126" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="154" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="182" cy="198" r="3" fill="#FFFFFF"/>
  <circle cx="210" cy="198" r="2.5" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Accent elements - connected dots to show flow/spark -->
  <circle cx="112" cy="72" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="128" cy="60" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="146" cy="68" r="3.5" fill="#FFFFFF" opacity="0.85"/>
  
  <!-- Connecting lines for the accent dots -->
  <line x1="112" y1="72" x2="128" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="128" y1="60" x2="146" y2="68" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
</svg>
