server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Compress text responses — important for the ~300 kB JS bundle
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;

    # Vite writes all hashed bundles under /assets/ — serve with a 1-year immutable cache
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Root-level static files (favicon, robots.txt, etc.)
    location ~* \.(svg|ico|png|webmanifest|txt)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # SPA catch-all: any path that is not a real file gets index.html
    # so React Router handles /login, /dashboard/campaigns, /terms-of-service, etc.
    # Note: do NOT use "$uri/" here — the directory check can cause nginx to
    # issue a redirect or return 403 before reaching the /index.html fallback.
    location / {
        try_files $uri /index.html;
    }

    server_tokens off;
}
