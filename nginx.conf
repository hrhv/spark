server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Long-lived cache for hashed static assets (JS/CSS bundles Vite names with content hashes)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback — every non-file route serves index.html so React Router handles navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable nginx version disclosure
    server_tokens off;
}
